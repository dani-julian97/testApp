<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Ikigai</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Ikigai — reset your life with a personalized 90-day habit plan.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ikigai">
  <link rel="apple-touch-icon" href="./assets/images/icon-192.png">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/screens.css">

  <link rel="preload" as="image" href="./assets/images/welcome.png">
  <link rel="preload" as="audio" href="./assets/audio/waves.mp3">
</head>
<body>
  <audio
    id="ambient-audio"
    src="./assets/audio/waves.mp3"
    loop
    preload="auto"
    autoplay
    playsinline
    aria-hidden="true"
  ></audio>
  <script>
    (function () {
      var audio = document.getElementById("ambient-audio");
      if (!audio) return;
      audio.volume = 0.22;
      function play() {
        audio.play().catch(function () {
          audio.muted = true;
          audio.play().then(function () {
            audio.muted = false;
            audio.volume = 0.22;
          }).catch(function () {});
        });
      }
      play();
      document.addEventListener("DOMContentLoaded", play);
    })();
  </script>
  <div id="app" role="application" aria-label="Ikigai"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
